spring.application.name=tradehub-api

spring.datasource.url=jdbc:mysql://localhost:3306/tradehub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=tradehub_user
spring.datasource.password=tradehub_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000

server.port=8080